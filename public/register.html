<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="login.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>infiniteJobs | register</title>
</head>
<body>
  <div class="background">

    <div class="bubble left-bubble"></div>
    <div class="bubble right-bubble"></div>

    <div class="overlay">
   
          
            <div class="login-card">
                <h1 class="card-title">Create Account</h1>
                <div class="role-selector">
                    <button class="role as-jobseeker">

                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        
                        Job Seeker</button>
                    <button class="role as-company"> 
                        <svg xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            width="18"
                            height="18"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round">
                        <path d="M6 22V4c0-.5.5-1 1-1h10c.5 0 1 .5 1 1v18"/>
                        <path d="M6 12H4c-.5 0-1 .5-1 1v9"/>
                        <path d="M18 9h2c.5 0 1 .5 1 1v12"/>
                        <path d="M10 6h4"/>
                        <path d="M10 10h4"/>
                        <path d="M10 14h4"/>
                        <path d="M10 18h4"/>
                        </svg>

        
                        Recruiter</button>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Name</label>
                        <input class="name" placeholder="Enter your Name">
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input class="email" placeholder="Enter your email">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" class="password" placeholder="Enter your password">
                       
                    </div>
                    
                    <button class="sign-up-button">Sign Up</button>
                </form>

                <div id="messagebox" class="response-message"></div>

                <div class="social-login">
                    <p>Or continue with</p>
                    <div class="social-buttons">
                        <button class="google-login social-btn"><svg class="google-login" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512" class="google-icon">
                        <path fill="currentColor" d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/>
                        </svg></button>

                        <button class="email-login social-btn"><svg class="email-login" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="email-icon">
                      <path fill="currentColor" d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"/>
                      </svg></button>
                    </div>

                      
                </div>
                

                <p class="signup-text">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
    </div>
 </div>
  
 <script src="register.js"></script>
</body>
</html>
