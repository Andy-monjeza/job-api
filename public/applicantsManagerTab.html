
<div class="job-manager-container">
  <div class="job-board-header">
    <div class="header-left">
        <h1 class="page-title">Applications Manager</h1>
    </div>
    <div class="header-right">
        
    </div>
</div>

<div class="table-controls">
    <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="jobSearch" placeholder="Search jobs..." onkeyup="filterJobs()">
    </div>
    <select id="categoryFilter" class="filter-select" onchange="filterJobs()">
        <option value="all">All categories</option>
        <option value="Engineering">Engineering</option>
        <option value="Design">Design</option>
        <option value="Marketing">Marketing</option>
    </select>
</div>

<div class="table-wrapper">
    <table class="job-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Job Title</th>
                <th>Location</th>
                <th>Applied On</th>
                <th style="width: 50px;"></th> </tr>
        </thead>
     
    </table>
</div>
</div>
