
<div class="job-manager-container">
  <div class="job-board-header">
    <div class="header-left">
        <h1 class="page-title">Job Manager</h1>
    </div>
    <div class="header-right">
        <button class="btn-new-job" id="createNewJob">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            New Job
        </button>
    </div>
</div>

<div class="table-controls">
    <div class="search-container">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="jobSearch" placeholder="Search jobs..." onkeyup="filterJobs()">
    </div>
    <select id="categoryFilter" class="filter-select" onchange="filterJobs()">
        <option value="all">All categories</option>
        <option value="Engineering">Engineering</option>
        <option value="Design">Design</option>
        <option value="Marketing">Marketing</option>
    </select>
</div>

<div class="table-wrapper">
    <table class="job-table">
        <thead>
            <tr>
                <th>Position</th>
                <th>Category</th>
                <th>Location</th>
                <th>Applicants</th>
                <th>Posted</th>
                <th style="width: 50px;"></th> </tr>
        </thead>
        <tbody id="jobTableBody">
            <tr>
                <td>
                    <div class="pos-cell">
                        <span class="pos-name">Senior Frontend Engineer</span>
                        <span class="pos-sub">Full-time • $150k - $190k</span>
                    </div>
                </td>
                <td><span class="category-text">Engineering</span></td>
                <td>
                    <div class="loc-cell">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        San Francisco, CA
                    </div>
                </td>
                <td class="text-center"><strong>34</strong></td>
                <td>
                    <div class="date-cell">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        Feb 10, 2026
                    </div>
                </td>
                <td class="action-cell">
                    <button class="dots-btn" onclick="toggleActionMenu(event)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</div>

<div id="jobModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Post New Job</h2>
            <button type="button" class="close-btn" onclick="window.closeJobModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <form id="postJobForm">
            <div class="form-grid">
                <input type="text" name="title" placeholder="Job Title" required>
                <input type="text" name="location" placeholder="Location">
                <input type="number" name="salary" placeholder="Salary ($)">
                <input type="text" name="category" placeholder="Category" required>
                
                <select name="type">
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                </select>

                <div class="form-group">
                    <label class="field-label">Due Date:</label>
                    <input type="date" name="dueDate" required>
                </div>
            </div>

            <textarea name="description" placeholder="Short Description" rows="2"></textarea>
            
            <textarea name="requirements" placeholder="Requirements (e.g. 3+ years experience - one per line)" rows="3"></textarea>
            <textarea name="responsibilities" placeholder="Responsibilities (one per line)" rows="3"></textarea>
            <textarea name="benefits" placeholder="Benefits (e.g. Medical, Remote Work - one per line)" rows="2"></textarea>
            
            <input type="text" name="skills" placeholder="Skills Required (comma separated: React, Node, SQL)">

            <button type="submit" class="btn-submit-job">Post Job Listing</button>
        </form>
    </div>
</div>
