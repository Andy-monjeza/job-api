<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="welcome.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | infiniteJobs</title>
</head>
<body>
    <div class="form-container">

    <div class="step active" id="companyStep1">
        <h2>Company Information</h2>

        <div class="grid grid-2x2">

            <!-- Phone -->
            <div class="input-group">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2
                    19.79 19.79 0 0 1-8.63-3.07
                    19.5 19.5 0 0 1-6-6
                    19.79 19.79 0 0 1-3.07-8.67
                    A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
                </svg>
                <input type="text" id="companyPhone" placeholder="Phone Number">
            </div>

            <!-- Location -->
            <div class="input-group">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/>
                </svg>
                <input type="text" id="companyLocation" placeholder="Location">
            </div>

            <!-- Website -->
            <div class="input-group">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
                <input type="text" id="companyWebsite" placeholder="Company Website">
            </div>

        </div>

        <button id="companyNextBtn">Next</button>
    </div>


    <!-- STEP 2 -->
    <div class="step" id="companyStep2">
        <h2>Company Description</h2>

        <div class="input-group">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16"/>
            </svg>
            <textarea id="companyDescription"
                      placeholder="Describe your company..."
                      style="resize:none; min-height:150px; width:100%; border:none; outline:none;">
            </textarea>
        </div>

        <button id="companyFinishBtn">Finish</button>
    </div>

</div>
<script src="recruiter-welcome.js"></script>
</body>
</html>
